<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi Amochis ❤️</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #ffe6e6;
            overflow: hidden;
            text-align: center;
        }

        #contenedor {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            z-index: 10;
            max-width: 90vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }

        #titulo {
            color: #d63384;
            font-size: 2rem;
            margin-bottom: 30px;
            min-height: 3.5rem;
            z-index: 11;
        }

        .botones {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            height: 250px; /* Espacio para que el botón SI crezca tranquilo */
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s ease-out, font-size 0.3s ease-out;
        }

        #btn-si {
            background-color: #28a745;
            color: white;
            z-index: 5;
        }

        #btn-no {
            background-color: #dc3545;
            color: white;
            z-index: 6;
        }

        .corazon {
            position: absolute;
            color: #ff4d4d;
            font-size: 20px;
            animation: flotar 3s infinite linear;
            opacity: 0.7;
            pointer-events: none;
        }

        @keyframes flotar {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        .oculto {
            display: none !important;
        }

        #mensaje-final h1 {
            font-size: 3rem;
            color: #ff0066;
            animation: latido 1s infinite;
        }

        @keyframes latido {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <script>
        for (let i = 0; i < 20; i++) {
            let corazon = document.createElement('div');
            corazon.className = 'corazon';
            corazon.innerHTML = '❤️';
            corazon.style.left = Math.random() * 100 + 'vw';
            corazon.style.animationDuration = (Math.random() * 3 + 2) + 's';
            corazon.style.fontSize = (Math.random() * 20 + 10) + 'px';
            document.body.appendChild(corazon);
        }
    </script>

    <div id="contenedor">
        <div id="pregunta-seccion">
            <h1 id="titulo">¿Quieres ser mi San Valentín? ❤️</h1>
            <div class="botones">
                <button id="btn-si" onclick="aceptar()">SÍ</button>
                <button id="btn-no" onclick="rechazar()">NO</button>
            </div>
        </div>

        <div id="mensaje-final" class="oculto">
            <h1>¡TE AMO MUCHO MI AMOCHIS! 😍❤️</h1>
            <p style="font-size: 1.5rem;">Sabía que dirías que sí...</p>
        </div>
    </div>

    <script>
        let escalaSi = 1;
        let escalaNo = 1;
        let frasesNo = [
            "¿Estás segura? 🥺",
            "¡Piénsalo otra vez! 🌸",
            "¡Dime que sí! ✨",
            "No seas malita... 🧸",
            "¡Ya casi ni ves el NO! 😂",
            "¡Dale al botón verde! 💚"
        ];
        let indiceFrase = 0;

        function rechazar() {
            // Agrandar el SÍ
            escalaSi += 0.5;
            document.getElementById('btn-si').style.transform = `scale(${escalaSi})`;
            
            // Achicar el NO (mínimo hasta 0.2 para que no desaparezca del todo)
            escalaNo = Math.max(0.2, escalaNo - 0.15);
            const btnNo = document.getElementById('btn-no');
            
            // Cambiar texto
            document.getElementById('titulo').innerText = frasesNo[indiceFrase];
            indiceFrase = (indiceFrase + 1) % frasesNo.length;

            // Mover el NO con su nueva escala
            let moveX = Math.random() * 100 - 50;
            let moveY = Math.random() * 100 - 50;
            btnNo.style.transform = `translate(${moveX}px, ${moveY}px) scale(${escalaNo})`;
        }

        function aceptar() {
            document.getElementById('pregunta-seccion').classList.add('oculto');
            document.getElementById('mensaje-final').classList.remove('oculto');
            
            for (let i = 0; i < 50; i++) {
                let corazon = document.createElement('div');
                corazon.className = 'corazon';
                corazon.innerHTML = '💖';
                corazon.style.left = Math.random() * 100 + 'vw';
                corazon.style.animationDuration = (Math.random() * 2 + 1) + 's';
                document.body.appendChild(corazon);
            }
        }
    </script>
</body>
</html>
